<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Каталог — Гриф</title>
    <meta name="description" content="Каталог электрогитар, акустики, комбиков и педалей" />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Шапка сайта: логотип, меню, избранное и переключатель темы -->
    <header class="site-header">
      <a class="logo" href="index.html">
        <img src="img/logo.svg" alt="" width="28" height="28" />
        Гриф
      </a>
      <button class="burger" aria-label="Меню" aria-expanded="false">Меню</button>
      <nav class="nav" id="nav">
        <a href="index.html">Главная</a>
        <a href="shop.html">Каталог</a>
        <a href="about.html">О нас</a>
        <a href="blog.html">Блог</a>
        <a href="contact.html">Контакты</a>
      </nav>
      <div class="tools">
        <span>
          Избранное:
          <b id="fav-count">0</b>
        </span>
        <button id="theme-toggle" aria-label="Сменить тему">Тема</button>
      </div>
    </header>
    <!-- Основное содержимое страницы -->
    <main>
      <section>
        <h1>Каталог</h1>
        <div class="filters" role="group" aria-label="Категории">
          <button data-f="all" aria-pressed="true">Все</button>
          <button data-f="electric" aria-pressed="false">Электрогитары</button>
          <button data-f="ibanez" aria-pressed="false">Ibanez</button>
          <button data-f="fender" aria-pressed="false">Fender</button>
          <button data-f="gibson" aria-pressed="false">Gibson</button>
          <button data-f="cort" aria-pressed="false">Cort</button>
          <button data-f="acoustic" aria-pressed="false">Акустика</button>
          <button data-f="amp" aria-pressed="false">Комбики</button>
          <button data-f="pedal" aria-pressed="false">Педали</button>
        </div>
        <label for="q">Поиск по каталогу</label>
        <input id="q" type="search" placeholder="Например: Jaguar" />
        <div class="grid" id="catalog" style="margin-top: 1.5rem"></div>
        <p id="empty" hidden>Ничего не нашлось. Сбросьте фильтр или измените запрос.</p>
      </section>
    </main>
    <!-- Подвал -->
    <footer class="site-footer">
      <p>
        ©
        <span id="year"></span>
        Гриф, магазин электрогитар
      </p>
      <p>ул. Гитарная, 5. Ежедневно с 10:00 до 20:00</p>
    </footer>
    <!-- Скрипты -->
    <script src="js/catalog.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
